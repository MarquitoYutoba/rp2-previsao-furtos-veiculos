# Bandas (UTM metros / horas)
h_s_list: [500, 1000, 1500, 2000]
h_t_list: [168, 336, 720, 2160]   # ~1 sem, 2 sem, 30 d, 90 d

t_eval_mode: median_test   # median_test | max_train | fixed
t_eval_fixed_hours: 0.0

# Treino / teste / malha
train_parquet: data/processed/stkde_train_grid.parquet
test_parquet: data/processed/stkde_test_grid.parquet
grid_cells_parquet: data/processed/grid_cells.parquet

output_dir: data/processed/stkde

# Desempenho (18k eventos × ~3,4k células)
chunk_size_eval: 256
chunk_size_test_ll: 512

# Métrica para escolher melhor par
select_by: loglik_test   # loglik_test | pai_at_10

pai_alphas: [0.01, 0.05, 0.10, 0.20]