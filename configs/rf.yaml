# Random Forest — painel célula × semana (malha 500 m)
train_grid: data/processed/stkde_train_grid.parquet
test_grid: data/processed/stkde_test_grid.parquet
grid_cells: data/processed/grid_cells.parquet
amostra_csv: data/amostra_completa_30000.csv

anos_treino: [2024, 2025]
anos_teste: [2026]

features:
  - x_center
  - y_center
  - ix
  - iy
  - lag_1
  - lag_2
  - lag_4
  - media_trimestre_hist
  - sin_semana
  - cos_semana
  - pct_automovel
  - pct_moto
  - pct_via_publica
  - ano_fab_medio
  - mes_medio_hist

model_params:
  n_estimators: 200
  max_depth: 20
  min_samples_leaf: 2
  random_state: 42
  n_jobs: -1

output_dir: data/processed/rf
reports_dir: reports/rf
pai_alphas: [0.01, 0.05, 0.10, 0.20]